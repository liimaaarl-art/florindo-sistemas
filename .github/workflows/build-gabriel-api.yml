name: Build Gabriel API bundle

on:
  push:
    branches: [main]
    paths:
      - 'gabriel-barbearia/api.mjs'
      - 'gabriel-barbearia/validation.mjs'
      - 'gabriel-barbearia/package.json'
      - 'gabriel-barbearia/package-lock.json'
      - '.github/workflows/build-gabriel-api.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install dependencies
        working-directory: gabriel-barbearia
        run: npm ci
      - name: Bundle Neon Function
        working-directory: gabriel-barbearia
        run: |
          mkdir -p dist
          npx esbuild api.mjs --bundle --platform=node --format=esm --target=node24 --banner:js='import { createRequire } from "module"; const require = createRequire(import.meta.url);' --outfile=dist/index.mjs
          cd dist
          zip -j ../deploy.zip index.mjs
          cd ..
          base64 -w0 deploy.zip > deploy.b64
      - name: Publish deployment bundle
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add gabriel-barbearia/deploy.b64
          if git diff --cached --quiet; then
            echo "Bundle unchanged"
          else
            git commit -m "Build Gabriel API deployment bundle"
            git push
          fi
